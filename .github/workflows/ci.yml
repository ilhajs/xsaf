name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Test
        run: bun test

      - name: Build package
        run: bun run build

      - name: Smoke test with Bun
        working-directory: packages/xsaf
        run: bun -e "import('./dist/index.mjs').then(m => { if (typeof m.agent !== 'function') process.exit(1) })"

      - name: Smoke test with Node
        working-directory: packages/xsaf
        run: node --input-type=module -e "const m = await import('./dist/index.mjs'); if (typeof m.agent !== 'function') process.exit(1)"

      - name: Smoke test terminal UI with Bun
        working-directory: packages/cli
        run: bun -e "import('./dist/index.mjs').then(m => { if (typeof m.default !== 'function') process.exit(1) })"

  package-preview:
    name: Publish package preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Publish preview with pkg.pr.new
        run: bunx pkg-pr-new publish './packages/xsaf' './packages/cli'

  docs:
    name: Build and deploy documentation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint documentation
        run: bun run --cwd apps/website lint:docs

      - name: Build website
        run: bun run --cwd apps/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
